<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Dashboard Kanban Hebdomadaire — Carré d'Hôtes</title>
    <meta name="description" content="Tableau Kanban hebdomadaire, suivi des questions et réunions d'équipe Carré d'Hôtes." />

    <!-- PWA & iOS / Android App Meta -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#F2F4F8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kanban CdH" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <script>
      try {
        if (localStorage.getItem('cdh-theme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.classList.add('dark');
          var tm = document.querySelector('meta[name="theme-color"]');
          if (tm) tm.setAttribute('content', '#0B0F17');
          var am = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
          if (am) am.setAttribute('content', 'black-translucent');
        }
      } catch (e) {}
    </script>

    <!-- Typographie Plus Jakarta Sans (fallback web non-bloquant pour SF Pro) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" /></noscript>
  </head>
  <body class="cdh-canvas-bg text-[var(--cdh-text-primary)] font-sans antialiased min-h-dvh">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
